name: Update jobs
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 urllib3
      - run: python -W ignore scraper.py
      - run: |
          git config user.name "jobs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add updates.json
          git diff --cached --quiet || (git commit -m "update jobs" && git push)
